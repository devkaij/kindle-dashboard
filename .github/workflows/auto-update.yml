name: Kindle Dashboard 自动更新

on:
  schedule:
    # 每天 8:00, 12:00, 18:00, 22:00 (北京时间)
    - cron: '0 0,4,10,14 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run generator
        run: python3 generate.py
        working-directory: .
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kindle_dashboard_*.html
          git diff --cached --quiet || git commit -m "Auto-update dashboard data [skip ci]"
          git push
